<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>班级随机排座</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;color:#1d1d1f;background:#f5f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,select{font:inherit}button{cursor:pointer;border:0;transition:transform .15s,background .2s,opacity .2s}button:active:not(:disabled){transform:scale(.975)}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1200px;margin:auto;padding:28px 24px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}.brand small{font-size:12px;letter-spacing:.16em;color:#86868b;font-weight:700}.brand h1{font-size:clamp(27px,3.4vw,39px);letter-spacing:-.045em;margin:5px 0 6px;font-weight:750}.brand p{margin:0;color:#86868b;font-size:13px}.badge{display:inline-flex;align-items:center;gap:7px;color:#616166;background:white;border:1px solid #e9e9ed;padding:9px 13px;border-radius:999px;font-size:12px;white-space:nowrap}.dot{width:7px;height:7px;background:#30b67a;border-radius:50%}.toolbar{display:flex;align-items:stretch;gap:12px;margin-bottom:18px}.modebox{flex:1;background:white;border:1px solid #e8e8ed;border-radius:18px;padding:10px 15px;min-width:0}.modebox label{display:block;font-size:11px;font-weight:650;color:#86868b;margin-bottom:5px}.modebox select{display:block;width:100%;border:0;outline:0;background:transparent;font-size:15px;font-weight:650;color:#1d1d1f;padding:2px 0}.refresh{background:#007aff;color:white;font-size:17px;font-weight:700;min-width:190px;border-radius:18px;box-shadow:0 7px 19px #007aff28;display:flex;align-items:center;justify-content:center;gap:9px}.refresh svg{width:19px;height:19px}.columns{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:18px;align-items:stretch}.card{background:white;border:1px solid #ebebef;border-radius:25px;padding:25px;box-shadow:0 8px 35px #1d1d1f06;min-width:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.section-head h2{font-size:19px;letter-spacing:-.035em;margin:0;font-weight:730}.section-head .muted{font-size:12px;color:#86868b}.name-area{margin:23px 0 17px;background:linear-gradient(160deg,#f5f9ff,#f8f8fa);border:1px solid #edf0f5;border-radius:22px;min-height:195px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;overflow:hidden}.eyebrow{color:#8e8e93;font-size:12px;font-weight:650;letter-spacing:.1em}.big{font-size:clamp(36px,5vw,60px);font-weight:800;letter-spacing:-.05em;color:#007aff;margin:14px 0;min-height:72px;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .14s,color .14s}.big.rolling{color:#ff9500;transform:scale(1.045)}.subtext{color:#8e8e93;font-size:12px}.actions{display:flex;gap:10px}.actions button{flex:1;border-radius:15px;padding:15px 9px;font-size:14px;font-weight:700;min-height:52px}.primary{background:#007aff;color:#fff}.secondary{background:#f1f2f6;color:#35353a}.progress-line{height:6px;border-radius:10px;background:#f0f0f3;overflow:hidden;margin:23px 0 12px}.progress-fill{height:100%;width:0;background:#007aff;border-radius:10px;transition:width .25s}.stats{display:flex;justify-content:space-between;color:#8e8e93;font-size:13px}.stats strong{color:#1d1d1f}.note{margin-top:19px;color:#8e8e93;font-size:12px;line-height:1.65}.board-card{padding:25px}.blackboard{margin:21px auto 18px;width:72%;border-radius:12px;background:#272b35;color:white;text-align:center;font-size:13px;letter-spacing:.2em;padding:13px;box-shadow:0 5px 15px #00000010}.sides{display:flex;justify-content:space-between;color:#86868b;font-size:12px;margin-bottom:13px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.seat{position:relative;border:1px solid #e8e9ed;background:#f7f7f9;border-radius:13px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:6px 2px;transition:background .13s,border-color .13s,transform .13s,box-shadow .13s;min-width:0}.seat .num{font-size:10px;color:#a0a0a7;font-variant-numeric:tabular-nums}.seat .person{font-size:12px;font-weight:650;word-break:break-all;line-height:1.2}.seat.empty .person{color:#b4b4bd;font-weight:400}.seat.occupied{background:#eef5ff;border-color:#d9e8ff;color:#1453a4}.seat.preview{background:#fff1d8;border:2px solid #ff9f0a;transform:scale(1.045);box-shadow:0 4px 16px #ff9f0a33;z-index:2}.seat.preview .person{color:#a96300}.seat.fresh{background:#e4f8ed;border:2px solid #30b67a;transform:scale(1.04);box-shadow:0 3px 14px #30b67a20}.seat.fresh .person{color:#167346}.seat.reserved{border-style:dashed}.board-foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.legend{font-size:11px;color:#8e8e93}.legend b{display:inline-block;width:8px;height:8px;border-radius:3px;margin:0 5px 0 10px}.legend b:first-child{margin-left:0}.orange{background:#ff9f0a}.green{background:#30b67a}.utility{display:flex;gap:8px}.utility button{background:#f2f2f6;color:#45454a;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:650}.description{font-size:12px;line-height:1.6;color:#86868b;margin:17px 0 0}.message{color:#c34a26;font-size:12px;min-height:18px;margin-top:8px}.privacy{font-size:11px;color:#a1a1a8;margin-top:20px;text-align:center}@media(max-width:760px){.wrap{padding:19px 13px 42px}.top{margin-bottom:19px}.brand h1{font-size:28px}.badge{display:none}.toolbar{gap:9px}.refresh{min-width:124px;font-size:16px}.columns{grid-template-columns:1fr;gap:13px}.card,.board-card{padding:18px;border-radius:22px}.name-area{min-height:150px;margin:18px 0 13px}.big{font-size:46px;min-height:55px}.seat{min-height:60px;border-radius:10px;gap:3px}.seat .person{font-size:11px}.seat .num{font-size:9px}.board{gap:5px}.blackboard{margin-top:17px}.actions button{min-height:50px}.board-foot{align-items:flex-start}}@media(max-width:360px){.seat .person{font-size:10px}.seat{min-height:54px}.modebox select{font-size:13px}.refresh{min-width:105px}}@media print{body{background:white}.wrap{max-width:none;padding:0}.top,.toolbar,.left,.utility,.privacy,.description,.legend{display:none!important}.columns{display:block}.board-card{box-shadow:none;border:0;padding:0}.seat{min-height:85px;background:white!important;color:black!important;border:1px solid #888!important}.seat .person{font-size:15px}.blackboard{background:#333!important;color:white!important;print-color-adjust:exact}}

.mode-overlay{position:fixed;inset:0;z-index:1000;background:rgba(17,24,39,.38);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;padding:20px}.mode-dialog{background:#fff;border-radius:30px;max-width:680px;width:100%;padding:34px 30px;box-shadow:0 24px 80px #0002;text-align:center}.mode-dialog h2{font-size:27px;letter-spacing:-.05em;margin:8px 0}.mode-dialog p{font-size:14px;color:#86868b;margin:0 0 24px}.mode-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.mode-choice{width:100%;text-align:left;border:1px solid #e6e6eb;background:#f8f8fa;border-radius:19px;padding:22px 18px;margin:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:12px;min-height:240px;cursor:pointer;transition:transform .18s,background .18s,border-color .18s}.mode-choice strong{display:block;font-size:17px;color:#1d1d1f}.mode-choice small{display:block;font-size:12px;color:#86868b;margin-top:5px}.mode-choice .arrow{font-size:22px;color:#007aff;align-self:flex-end;margin-top:auto}.mode-emoji{font-size:38px;line-height:1.2}.mode-choice .details{font-size:13px;color:#484851;line-height:1.7;margin-top:12px;display:block}.mode-choice:hover{border-color:#a5caff;transform:translateY(-2px)}.mode-choice:active{background:#eaf3ff}.mode-overlay[hidden]{display:none!important}body.dialog-open{overflow:hidden}@media(max-width:420px){.mode-dialog{padding:25px 19px;border-radius:26px}.mode-dialog h2{font-size:25px}.mode-dialog{padding:24px 18px}.mode-options{gap:10px}.mode-choice{padding:17px 12px;min-height:255px}.mode-choice strong{font-size:16px}.mode-emoji{font-size:32px}}
.release-meta{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:22px;color:#86868b;font-size:12px;letter-spacing:.01em}.release-version{font-weight:650;color:#6e6e73}.release-separator{color:#c7c7cc}@media(max-width:420px){.release-meta{margin-top:18px;font-size:11px}}</style></head><body><div id="modeOverlay" class="mode-overlay" role="dialog" aria-modal="true" aria-labelledby="modeTitle"><div class="mode-dialog"><h2 id="modeTitle">智能随机排座系统</h2><p>请选择本轮的排座模式</p><div class="mode-options"><button class="mode-choice" id="chooseFull" type="button"><span class="mode-emoji" aria-hidden="true">🎲</span><span><strong>完全随机</strong><small>姓名随机 · 座位随机</small><span class="details">每次随机抽取一位同学，并从可用座位中随机选择位置。姓名与座位同步滚动，最终确定入座。</span></span><span class="arrow">↗</span></button><button class="mode-choice" id="chooseSemi" type="button"><span class="mode-emoji" aria-hidden="true">🐍</span><span><strong>半随机</strong><small>姓名随机 · S 型入座</small><span class="details">学生姓名随机抽取，座位从靠近黑板的第一排开始，左右交替按 S 型路线依次入座。</span></span><span class="arrow">↗</span></button></div><div class="release-meta"><span class="release-version">版本 V15.0</span><span class="release-separator">·</span><span>更新于 2026年11月15日</span></div></div></div><main class="wrap"><header class="top"><div class="brand"><h1>班级随机排座</h1><p>25 名学生 · 6 列 × 5 排 · 左窗右门</p></div><span class="badge"><span class="dot"></span>课堂排座系统</span></header><div class="toolbar"><div class="modebox"><label for="mode">排座模式</label><select id="mode"><option value="full">完全随机 · 姓名与座位随机</option><option value="semi">半随机 · 姓名随机，座位 S 型</option></select></div><button id="reset" class="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 7l2 5M4 12l2 5a7 7 0 0 0 12.4-2"/></svg>刷新座位</button></div><div class="columns"><section class="card left"><div class="section-head"><h2>随机点名</h2><span class="muted" id="drawState">等待抽取</span></div><div class="name-area"><div class="big" id="result" aria-live="polite">准备开始</div><div class="subtext" id="subtext">点击按钮，开始随机排座</div></div><div class="actions"><button id="draw" class="primary">随机抽取并入座</button><button id="all" class="secondary">动画排完全部</button></div><div class="progress-line"><div class="progress-fill" id="progress"></div></div><div class="stats"><span>已安排 <strong id="count">0 / 25</strong></span><span id="remain">剩余 25 人</span></div><div id="message" class="message"></div></section><section class="card board-card"><div class="section-head"><h2>教室座位</h2><span class="muted">实时排座</span></div><div class="blackboard">黑板 / 讲台</div><div class="sides"><span>☀ 左侧 · 窗户</span><span>右侧 · 门 🚪</span></div><div class="board" id="board"></div><div class="board-foot"><div class="legend"><b class="orange"></b>抽取中 <b class="green"></b>刚入座</div><div class="utility"><button id="print">打印</button><button id="export">导出 CSV</button></div></div></section></div></main><script>
(function(){'use strict';
var STUDENTS=['吴双','王宇巍','朱媛熙','王鑫桐','宋冰悦','龙文灏','刘昊伦','李初阳','韩雨琪','葛济瑄','房楷淇','张茗晞','王一笑','沈诗棋','钮楚洋','米天泽','李佳彤','龚子轩','刘笑渤','赵子彤','吕奕宁','白焕阳','陈韵雯','顾清雅','曹炳震'];
var SPECIAL='龚子轩', $=function(id){return document.getElementById(id)},seats=[],route=[],remaining=[],assigned=0,mode='full',busy=false,preview=-1,fresh=-1,runToken=0;
function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function makeRoute(){var front=[],back=[],r,c;if(mode==='semi'){for(r=0;r<4;r++){if(r%2===0){for(c=0;c<6;c++)(r<2?front:back).push(r*6+c)}else{for(c=5;c>=0;c--)(r<2?front:back).push(r*6+c)}}}else{front=shuffled(Array.from({length:12},function(_,i){return i}));back=shuffled(Array.from({length:12},function(_,i){return i+12}))}back.push(mode==='semi'?24:24+Math.floor(Math.random()*6));return front.concat(back)}
function start(){runToken++;preview=-1;fresh=-1;mode=$('mode').value;seats=Array(30).fill('');route=makeRoute();remaining=STUDENTS.slice();assigned=0;busy=false;$('result').textContent='准备开始';$('result').classList.remove('rolling');$('message').textContent='';$('subtext').textContent='点击按钮，开始随机排座';render()}
function render(){var board=$('board');board.textContent='';for(var i=0;i<30;i++){var d=document.createElement('div'),n=document.createElement('span'),p=document.createElement('span');d.className='seat '+(seats[i]?'occupied':'empty')+(preview===i?' preview':'')+(fresh===i?' fresh':'');n.className='num';n.textContent=(Math.floor(i/6)+1)+'-'+(i%6+1);p.className='person';p.textContent=seats[i]||(preview===i?'抽取中':'空位');d.appendChild(n);d.appendChild(p);board.appendChild(d)}$('count').textContent=assigned+' / 25';$('remain').textContent='剩余 '+remaining.length+' 人';$('progress').style.width=(assigned/25*100)+'%';$('draw').disabled=assigned===25||busy;$('all').disabled=assigned===25||busy;$('mode').disabled=busy;$('reset').disabled=busy;$('drawState').textContent=busy?'正在随机…':assigned===25?'全部完成':'等待抽取'}
function sleep(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
function pickStudent(){// 前两排的最后一个位置必须留给龚子轩，确保每轮100%满足约束
 if(assigned===11&&remaining.indexOf(SPECIAL)>=0)return SPECIAL;
 return remaining[Math.floor(Math.random()*remaining.length)];}
async function drawAnimated(quick,token){if(!remaining.length||token!==runToken)return;var chosen=pickStudent(),target=route[assigned],available=route.slice(assigned),ticks=quick?7:24;$('result').classList.add('rolling');$('subtext').textContent='正在随机抽取…';for(var k=0;k<ticks;k++){if(token!==runToken)return;$('result').textContent=remaining[Math.floor(Math.random()*remaining.length)];preview=mode==='full'?available[Math.floor(Math.random()*available.length)]:target;render();await sleep(quick?45:Math.round(40+Math.pow(k/ticks,2)*175))}if(token!==runToken)return;preview=-1;fresh=target;remaining.splice(remaining.indexOf(chosen),1);seats[target]=chosen;assigned++;$('result').textContent=chosen;$('result').classList.remove('rolling');$('subtext').textContent='已入座 · 第 '+(Math.floor(target/6)+1)+' 排 · 第 '+(target%6+1)+' 列';render();await sleep(quick?100:420);if(token!==runToken)return;fresh=-1;render()}
async function drawOne(){if(busy||!remaining.length)return;busy=true;render();var token=runToken;try{await drawAnimated(false,token)}finally{if(token===runToken){busy=false;render()}}}
async function all(){if(busy||!remaining.length)return;busy=true;render();var token=runToken;try{while(remaining.length&&token===runToken)await drawAnimated(true,token)}finally{if(token===runToken){busy=false;render()}}}
function exportCsv(){var lines=[['排/列','第1列','第2列','第3列','第4列','第5列','第6列']];for(var r=0;r<5;r++)lines.push(['第'+(r+1)+'排'].concat(seats.slice(r*6,r*6+6).map(function(x){return x||'空位'})));var csv='\ufeff'+lines.map(function(row){return row.map(function(s){return '"'+String(s).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');try{var blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='班级座位表.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}catch(e){$('message').textContent='下载失败，请使用 Safari 或电脑浏览器'}}
function showModeDialog(){if(busy)return;$('modeOverlay').hidden=false;document.body.classList.add('dialog-open')}
function chooseMode(value){$('mode').value=value;$('modeOverlay').hidden=true;document.body.classList.remove('dialog-open');start()}
$('chooseFull').addEventListener('click',function(){chooseMode('full')});$('chooseSemi').addEventListener('click',function(){chooseMode('semi')});
$('mode').addEventListener('change',start);$('reset').addEventListener('click',showModeDialog);$('draw').addEventListener('click',drawOne);$('all').addEventListener('click',all);$('export').addEventListener('click',exportCsv);$('print').addEventListener('click',function(){window.print()});start();document.body.classList.add('dialog-open');
})();
</script></body></html>
